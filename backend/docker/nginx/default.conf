server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/backend/public;
    client_max_body_size 20M;

    # HTTP dev listener. script-src and connect-src allow the Vite dev server and
    # the inline style on Laravel's welcome page. frame-ancestors stays none.
    # HSTS belongs on the HTTPS server only.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' https://fonts.bunny.net; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:5173 http://127.0.0.1:5173; connect-src 'self' http://localhost:5173 http://127.0.0.1:5173 ws://localhost:5173 ws://127.0.0.1:5173" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Resolve the PHP upstream at request time. Docker's DNS name "backend"
    # is not available when nginx only parses the file, and a static lookup
    # would freeze a stale container IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ~ \.php$ {
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
