services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the .env file beside docker-compose.yml}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-core_ecommerce}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file beside docker-compose.yml}
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      SESSION_DOMAIN: ""
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the .env file beside docker-compose.yml}
      REDIS_PORT: "6379"
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:5173,127.0.0.1,127.0.0.1:8000,127.0.0.1:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Link trong email (đặt lại mật khẩu, xác thực) trỏ về SPA
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_NAME: ${APP_NAME:-Core Điện}
      APP_LOCALE: ${APP_LOCALE:-vi}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-vi}
      # Dev: mọi email đi vào Mailpit (UI http://127.0.0.1:8025), không gửi ra ngoài
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SCHEME: ""
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@ecom.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Core Điện}
    command:
      - sh
      - -c
      - (test -f vendor/autoload.php || composer install --no-interaction --prefer-dist) && printf '%s\n' 'listen = 0.0.0.0:9000' > /usr/local/etc/php-fpm.d/zz-listen.conf && mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R a+rwX storage bootstrap/cache && php artisan migrate --force && (test -e public/storage || php artisan storage:link) && chmod -R a+rwX storage bootstrap/cache && exec php-fpm
    networks:
      - ecom_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Hộp thư dev: SMTP 1025, giao diện web 8025 — chỉ bind 127.0.0.1
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecom_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
    networks:
      - ecom_network

  frontend:
    image: node:22-alpine
    container_name: ecom_frontend
    restart: unless-stopped
    working_dir: /var/www/frontend
    ports:
      - "5173:5173"
    environment:
      DEV_PROXY_TARGET: ${DEV_PROXY_TARGET:-http://nginx:80}
      CHOKIDAR_USEPOLLING: "true"
      NODE_OPTIONS: --dns-result-order=ipv4first
    command: sh -c "npm ci && npm run dev -- --host"
    volumes:
      - ./frontend:/var/www/frontend
      - frontend_node_modules:/var/www/frontend/node_modules
    networks:
      - ecom_network
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    container_name: ecom_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ecom_network
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: ecom_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-core_ecommerce}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file beside docker-compose.yml}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ecom_mysql_data:/var/lib/mysql
    networks:
      - ecom_network

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the .env file beside docker-compose.yml}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the .env file beside docker-compose.yml}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecom_network

networks:
  ecom_network:
    driver: bridge

volumes:
  ecom_mysql_data:
  frontend_node_modules:
