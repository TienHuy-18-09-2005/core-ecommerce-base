services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    networks:
      - ecom_network
    depends_on:
      - mysql
      - redis

  frontend:
    image: node:20-alpine
    container_name: ecom_frontend
    restart: unless-stopped
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - ecom_network

  nginx:
    image: nginx:alpine
    container_name: ecom_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ecom_network
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: ecom_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: core_ecommerce
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33066:3306"
    volumes:
      - ecom_mysql_data:/var/lib/mysql
    networks:
      - ecom_network

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    networks:
      - ecom_network

networks:
  ecom_network:
    driver: bridge

volumes:
  ecom_mysql_data:
